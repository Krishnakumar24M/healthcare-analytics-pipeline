name: Healthcare App CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Pipeline & Model Unit Tests
      run: |
        pytest tests/ -v --junitxml=junit/test-results.xml

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Run Docker Build Check
      run: |
        docker build -t healthcare-risk-app:${{ github.sha }} .
        docker tag healthcare-risk-app:${{ github.sha }} healthcare-risk-app:latest

